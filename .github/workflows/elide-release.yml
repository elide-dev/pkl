#
# Builds Elide's fork of pkl-core and publishes it to https://maven.elide.dev/pkl-elide/<version>, a
# Maven repository holding org.pkl-lang:pkl-core:<version>. Only pkl-core is forked: its POM keeps
# upstream's dependencies, including pkl-parser at the upstream version, which comes from Central.
#
# The version is upstream's (gradle.properties) with an `-elide.N` suffix, e.g. 0.32.2-elide.1. The
# suffix is on the Maven coordinates only: the jar is a release build of the upstream version, so
# Release.properties (Pkl's own version, which modules' minPklVersion compares with) stays 0.32.2.
#
# Triggers:
#   - Push a tag `<version>`, e.g. `0.32.2-elide.1`, to build and publish.
#   - Manual dispatch, which builds and stages only unless `publish` is set.
#
name: Elide release

on:
  push:
    tags:
      - "*-elide.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.32.2-elide.1"
        required: true
        type: string
      publish:
        description: "Publish to maven.elide.dev"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: elide-release-${{ github.ref }}
  cancel-in-progress: false

env:
  R2_BUCKET: elide-maven
  R2_ROOT: pkl-elide
  PUBLIC_BASE: https://maven.elide.dev/pkl-elide
  GROUP_PATH: org/pkl-lang
  ARTIFACT: pkl-core

jobs:
  release:
    name: Build and publish pkl-core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - name: Determine version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version=${GITHUB_REF_NAME}
            publish=true
          else
            version=${INPUT_VERSION}
            publish=${INPUT_PUBLISH}
          fi
          if ! [[ "${version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-elide\.[0-9]+$ ]]; then
            echo "::error::invalid release version '${version}'"
            exit 1
          fi
          base=${BASH_REMATCH[1]}
          upstream=$(sed -n 's/^version=//p' gradle.properties)
          if [ "${base}" != "${upstream}" ]; then
            echo "::error::${version} is not a release of upstream ${upstream} (gradle.properties)"
            exit 1
          fi
          {
            echo "VERSION=${version}"
            echo "BASE_VERSION=${base}"
            echo "PUBLISH=${publish}"
          } >> "${GITHUB_ENV}"
          echo "Release ${version} (upstream ${base}) from ${GITHUB_SHA}, publish=${publish}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Set up JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5
        with:
          java-version: "25"
          distribution: temurin
          architecture: x64
      - name: Build
        run: |
          ./gradlew --no-daemon :pkl-core:jar :pkl-core:sourcesJar :pkl-core:generatePomFileForLibraryPublication \
            -DreleaseBuild=true "-DcommitId=${GITHUB_SHA}"
      - name: Stage the Maven repository
        run: |
          dir="stage/${GROUP_PATH}/${ARTIFACT}"
          out="${dir}/${VERSION}"
          mkdir -p "${out}"
          jar="pkl-core/build/libs/${ARTIFACT}-${BASE_VERSION}.jar"
          # The fork's lazy engine init (VmEngineHolder) is why it exists.
          unzip -l "${jar}" | grep -q 'org/pkl/core/runtime/VmEngineHolder.class' \
            || { echo "::error::${jar} lacks VmEngineHolder"; exit 1; }
          [ "$(unzip -p "${jar}" org/pkl/core/Release.properties | sed -n 's/^version=//p')" = "${BASE_VERSION}" ] \
            || { echo "::error::${jar} is not a release build of ${BASE_VERSION}"; exit 1; }
          cp "${jar}" "${out}/${ARTIFACT}-${VERSION}.jar"
          cp "pkl-core/build/libs/${ARTIFACT}-${BASE_VERSION}-sources.jar" "${out}/${ARTIFACT}-${VERSION}-sources.jar"
          # Upstream's POM with the project's version changed. The module metadata is not published,
          # so the marker telling consumers to prefer it goes.
          python3 - "pkl-core/build/publications/library/pom-default.xml" "${out}/${ARTIFACT}-${VERSION}.pom" <<'EOF'
          import os, re, sys
          import xml.etree.ElementTree as ET
          src, dst = sys.argv[1:]
          version, base, artifact = os.environ["VERSION"], os.environ["BASE_VERSION"], os.environ["ARTIFACT"]
          pom = open(src, encoding="utf-8").read()
          own = f"<artifactId>{artifact}</artifactId>\n  <version>{base}</version>"
          if pom.count(own) != 1:
              sys.exit(f"expected one project version {base} in {src}")
          pom = pom.replace(own, f"<artifactId>{artifact}</artifactId>\n  <version>{version}</version>")
          pom = re.sub(r"  <!-- [^\n]*-->\n", "", pom)
          open(dst, "w", encoding="utf-8").write(pom)
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse(dst).getroot()
          assert root.findtext("m:version", namespaces=ns) == version
          for dep in root.iterfind("m:dependencies/m:dependency", ns):
              coords = ":".join(dep.findtext(f"m:{k}", namespaces=ns) for k in ("groupId", "artifactId", "version"))
              if "elide" in coords:
                  sys.exit(f"dependency {coords} must come from Central")
              print(f"depends on {coords} ({dep.findtext('m:scope', namespaces=ns)})")
          EOF
          cat > "${dir}/maven-metadata.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <metadata>
            <groupId>${GROUP_PATH//\//.}</groupId>
            <artifactId>${ARTIFACT}</artifactId>
            <versioning>
              <release>${VERSION}</release>
              <versions>
                <version>${VERSION}</version>
              </versions>
              <lastUpdated>$(date -u +%Y%m%d%H%M%S)</lastUpdated>
            </versioning>
          </metadata>
          EOF
          find stage -type f | sort | while read -r f; do
            md5sum "${f}" | cut -d' ' -f1 > "${f}.md5"
            sha1sum "${f}" | cut -d' ' -f1 > "${f}.sha1"
            sha256sum "${f}" | cut -d' ' -f1 > "${f}.sha256"
          done
          (cd stage && find . -type f | sort) | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "jar sha256: $(cat "${out}/${ARTIFACT}-${VERSION}.jar.sha256")" | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Upload the staged repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pkl-elide-${{ env.VERSION }}
          path: stage
          if-no-files-found: error
          retention-days: 30
      - name: Refuse to overwrite a published version
        if: env.PUBLISH == 'true'
        run: |
          url="${PUBLIC_BASE}/${VERSION}/${GROUP_PATH}/${ARTIFACT}/${VERSION}/${ARTIFACT}-${VERSION}.pom"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${url}")
          if [ "${code}" = "200" ]; then
            echo "::error::${VERSION} is already published; versions are immutable, pick a new one"
            exit 1
          fi
      - name: Upload to R2
        if: env.PUBLISH == 'true'
        uses: elide-tools/r2-upload-action@b59314040b32715ae31337cdbb7418582ade7cff  # main
        with:
          path: stage
          target: ${{ env.R2_ROOT }}/${{ env.VERSION }}
          bucket: ${{ env.R2_BUCKET }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Verify the published release
        if: env.PUBLISH == 'true'
        run: |
          cd stage
          find . -type f ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' | sort | while read -r f; do
            f=${f#./}
            url="${PUBLIC_BASE}/${VERSION}/${f}"
            remote=$(curl -sSfL "${url}" | sha256sum | cut -d' ' -f1)
            local=$(cat "${f}.sha256")
            [ "${remote}" = "${local}" ] || { echo "::error::${url}: published ${remote}, built ${local}"; exit 1; }
            echo "${url} ${local}" | tee -a "${GITHUB_STEP_SUMMARY}"
          done
